{%load static%}
<html>
<head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">

</head>
<body>
    <div class='container'>
        <div class='card1'>
            <div class='dashboard'>
                <h2> Welcome to admin
            </div>
            <div class='createButton'>
                <a href="{% url 'add_student' %}">
                    <button>Add Student</button>
                </a>
            </div>
        </div>
        <div class='card2'>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Age</th>
                        <th>Study</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    {% for student in students %}
                    <tr>
                        <td>{{student.id}}</td>
                        <td>{{student.name}}</td>
                        <td>{{student.age}}</td>
                        <td>{{student.study}}</td>
                        <td>
                            <a href="{% url 'edit_student' student.id %}">
                                <button>Edit</button>
                            </a>

                            <a href="{% url 'delete_student' student.id %}"
                            onclick="return confirm('Are you sure you want to delete this student?');">
                                <button style="background-color:red; color:white;">
                                    Delete
                                </button>
                            </a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
